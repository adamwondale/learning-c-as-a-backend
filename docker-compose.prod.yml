services:
  postgres:
    image: postgres:16-alpine
    container_name: todo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tododb
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/adamwondale/todo-backend:${APP_VERSION:-latest}
    container_name: todo_backend
    restart: unless-stopped
    labels:
      # Tell Watchtower to automatically update this container
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=tododb;Username=postgres;Password=postgrespassword
    ports:
      - "5000:8080"
    depends_on:
      - postgres

  frontend:
    image: ghcr.io/adamwondale/todo-frontend:${APP_VERSION:-latest}
    container_name: todo_frontend
    restart: unless-stopped
    labels:
      # Tell Watchtower to automatically update this container
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - INTERNAL_BACKEND_URL=http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      # Gives Watchtower permission to recreate containers via Docker Desktop
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Match modern Docker API version
      - DOCKER_API_VERSION=1.44
      # Check GitHub Container Registry every 30 seconds
      - WATCHTOWER_POLL_INTERVAL=30
      # Automatically delete old, superseded image layers to save disk space
      - WATCHTOWER_CLEANUP=true
      # Only auto-update containers explicitly marked with com.centurylinklabs.watchtower.enable=true
      - WATCHTOWER_LABEL_ENABLE=true

volumes:
  postgres_data:
