services:
  postgres:
    image: postgres:16-alpine
    container_name: todo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tododb
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    # APP_VERSION can be: latest, sha-a1b2c3d, build-42, or v1.0.0
    image: ghcr.io/adamwondale/todo-backend:${APP_VERSION:-latest}
    container_name: todo_backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=tododb;Username=postgres;Password=postgrespassword
    ports:
      - "5000:8080"
    depends_on:
      - postgres

  frontend:
    # APP_VERSION can be: latest, sha-a1b2c3d, build-42, or v1.0.0
    image: ghcr.io/adamwondale/todo-frontend:${APP_VERSION:-latest}
    container_name: todo_frontend
    restart: unless-stopped
    environment:
      - INTERNAL_BACKEND_URL=http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
